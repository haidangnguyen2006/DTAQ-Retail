<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 16px;
    font: 12px/1.5 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #111b28);
    background: var(--figma-color-bg, #fff);
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--figma-color-text-secondary, #5a6472); }
  label.drop {
    display: block; padding: 14px; border: 1px dashed var(--figma-color-border, #afb8c4);
    border-radius: 8px; text-align: center; cursor: pointer; margin-bottom: 12px;
  }
  label.drop:hover { border-color: var(--figma-color-border-brand, #006dd7); }
  input[type=file] { display: none; }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1; height: 32px; border-radius: 6px; border: 1px solid var(--figma-color-border, #dae0e8);
    background: var(--figma-color-bg, #fff); color: inherit; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary { background: #006dd7; border-color: #006dd7; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 12px; min-height: 36px; }
  .error { color: var(--figma-color-text-danger, #c2342c); }
  progress { width: 100%; height: 6px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Nhập giao diện DTAQ</h1>
  <p>Chọn <b>tất cả</b> tệp trong thư mục <code>tools/figma-plugin/screens</code> (các ảnh .png và <code>screens.json</code>).</p>
  <label class="drop" for="files" id="pick">Bấm để chọn tệp…</label>
  <input id="files" type="file" multiple accept=".png,.json">
  <div class="row">
    <button id="close">Đóng</button>
    <button id="run" class="primary" disabled>Dựng thiết kế</button>
  </div>
  <div id="status"></div>
  <progress id="bar" value="0" max="1" hidden></progress>

<script>
  const input = document.getElementById('files');
  const run = document.getElementById('run');
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  let files = [];
  let waiting = null;

  input.addEventListener('change', () => {
    files = Array.from(input.files);
    const pngs = files.filter((f) => f.name.endsWith('.png')).length;
    const hasJson = files.some((f) => f.name === 'screens.json');
    document.getElementById('pick').textContent = pngs + ' ảnh' + (hasJson ? ' + screens.json' : '');
    status.className = hasJson ? '' : 'error';
    status.textContent = hasJson ? 'Sẵn sàng.' : 'Thiếu screens.json — hãy chọn cả tệp này.';
    run.disabled = !hasJson || pngs === 0;
  });

  // Gửi lần lượt từng ảnh và chờ plugin xác nhận để không dồn bộ nhớ.
  function send(message, transfer) {
    return new Promise((resolve, reject) => {
      waiting = { resolve, reject };
      parent.postMessage({ pluginMessage: message }, '*', transfer);
    });
  }

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'error') {
      status.className = 'error';
      status.textContent = 'Lỗi: ' + msg.message;
      if (waiting) waiting.reject(new Error(msg.message));
      return;
    }
    if (msg.type === 'done') {
      status.className = '';
      status.textContent = 'Xong: ' + msg.frames + ' màn hình, ' + msg.links
        + ' liên kết. Mở chế độ Present để chạy prototype.';
    }
    if (waiting) { const w = waiting; waiting = null; w.resolve(msg); }
  };

  run.addEventListener('click', async () => {
    run.disabled = true;
    try {
      const spec = JSON.parse(await files.find((f) => f.name === 'screens.json').text());
      const byName = new Map(files.map((f) => [f.name, f]));
      const screens = spec.screens.filter((s) => byName.has(s.file));
      if (screens.length === 0) throw new Error('Không có ảnh nào khớp với screens.json');
      bar.hidden = false;
      bar.max = screens.length;
      await send({ type: 'begin', spec: Object.assign({}, spec, { screens }) });
      for (let i = 0; i < screens.length; i++) {
        status.textContent = 'Đang dựng ' + screens[i].title + ' (' + (i + 1) + '/' + screens.length + ')';
        const bytes = new Uint8Array(await byName.get(screens[i].file).arrayBuffer());
        await send({ type: 'screen', id: screens[i].id, bytes });
        bar.value = i + 1;
      }
      status.textContent = 'Đang nối luồng prototype…';
      await send({ type: 'finish' });
    } catch (e) {
      status.className = 'error';
      status.textContent = 'Lỗi: ' + e.message;
      run.disabled = false;
    }
  });

  document.getElementById('close').addEventListener('click', () => {
    parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
  });
</script>
</body>
</html>
