@accentColor = #2457F5
@background = #F4F6FA
@foreground = #151A24
@disabledForeground = #8792A3
@selectionBackground = #EEF3FF
@selectionForeground = #151A24
@selectionInactiveBackground = #ECEFF5

Component.arc = 16
Button.arc = 16
TextComponent.arc = 16
CheckBox.arc = 8
# Viền focus 2px để người dùng bàn phím nhìn thấy ô đang chọn
Component.focusWidth = 2
Component.innerFocusWidth = 0
Component.focusColor = #6F8FF8
Component.borderColor = #C5CDD9
Component.focusedBorderColor = #2457F5
Component.disabledBorderColor = #DDE2EB

Button.background = #FFFFFF
Button.foreground = #151A24
Button.borderColor = #C5CDD9
Button.hoverBackground = #F4F6FA
Button.pressedBackground = #ECEFF5
Button.default.background = #2457F5
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = #1F4FD8
Button.default.pressedBackground = #1A3FB0
Button.default.borderWidth = 0
Button.disabledBackground = #ECEFF5
Button.toolbar.hoverBackground = #ECEFF5
Button.toolbar.pressedBackground = #DDE2EB

TextField.placeholderForeground = #8792A3
TextField.margin = 0,12,0,12
PasswordField.margin = 0,12,0,12
PasswordField.showRevealButton = true
TextArea.margin = 8,12,8,12
ComboBox.padding = 0,12,0,8
ComboBox.selectionBackground = #EEF3FF
ComboBox.selectionForeground = #151A24

Table.rowHeight = 40
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.gridColor = #ECEFF5
Table.selectionBackground = #EEF3FF
Table.selectionForeground = #151A24
Table.selectionInactiveBackground = #F4F6FA
Table.selectionInactiveForeground = #151A24
TableHeader.background = #FAFBFD
TableHeader.foreground = #5B6577
TableHeader.height = 36
TableHeader.separatorColor = #FAFBFD
TableHeader.bottomSeparatorColor = #DDE2EB

ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.thumb = #C5CDD9
ScrollBar.hoverThumbColor = #8792A3
ScrollPane.smoothScrolling = true
ScrollPane.border = 0,0,0,0

TabbedPane.tabType = underlined
TabbedPane.tabHeight = 40
TabbedPane.underlineColor = #2457F5
TabbedPane.inactiveUnderlineColor = #8EA9FC
TabbedPane.hoverColor = #F4F6FA
TabbedPane.focusColor = #EEF3FF
TabbedPane.selectedForeground = #151A24
TabbedPane.foreground = #5B6577
TabbedPane.contentAreaColor = #DDE2EB
TabbedPane.showTabSeparators = false

Popup.dropShadowPainted = true
PopupMenu.borderCornerRadius = 10
ToolTip.background = #1F2633
ToolTip.foreground = #FFFFFF
ToolTip.border = 6,10,6,10

ProgressBar.arc = 999
ProgressBar.foreground = #2457F5
ProgressBar.background = #ECEFF5
CheckBox.icon.selectedBackground = #2457F5
CheckBox.icon.checkmarkColor = #FFFFFF
Separator.foreground = #DDE2EB

Panel.background = #F4F6FA
OptionPane.background = #FFFFFF
